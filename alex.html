<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Alex — Game Boys Studios</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    /* Chat mínimo; puedes adaptarlo a tu styles.css */
    body { margin: 0; font-family: system-ui, sans-serif; background: #0f0f12; color: #e8e8ed; }
    .chat-wrap { max-width: 720px; margin: 0 auto; height: 100vh; display: flex; flex-direction: column; }
    .chat-header { padding: 16px; border-bottom: 1px solid #2a2a35; }
    .chat-header a { color: #7c6af5; text-decoration: none; }
    #messages { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
    .msg { padding: 12px 16px; border-radius: 12px; max-width: 85%; line-height: 1.5; }
    .msg.user { background: #2a2a35; align-self: flex-end; }
    .msg.alex { background: #1c1c24; align-self: flex-start; }
    .input-row { display: flex; gap: 8px; padding: 16px; border-top: 1px solid #2a2a35; }
    #input { flex: 1; padding: 12px; border-radius: 8px; border: 1px solid #2a2a35; background: #16161c; color: #e8e8ed; }
    #btn { padding: 12px 20px; border: none; border-radius: 8px; background: #7c6af5; color: #fff; cursor: pointer; }
    .thinking { display: none; padding: 8px 16px; color: #8b8b9a; font-size: 0.9rem; }
    .thinking.show { display: block; }
  </style>
</head>
<body>
  <div class="chat-wrap">
    <div class="chat-header">
      <a href="index.html">← Volver</a>
      &nbsp;·&nbsp; <strong>Alex</strong> — IA local de Game Boys Studios
    </div>
    <div id="messages"></div>
    <div class="thinking" id="thinking">Alex está pensando…</div>
    <div class="input-row">
      <input id="input" type="text" placeholder="Escribe un mensaje…" autocomplete="off" />
      <button id="btn">Enviar</button>
    </div>
  </div>

  <script>
    // ⚠️ Cambia esta URL por la de tu servicio en Render
    const ALEX_API = "https://alex-ia-cl4n.onrender.com";

    const messagesEl = document.getElementById("messages");
    const inputEl = document.getElementById("input");
    const btn = document.getElementById("btn");
    const thinking = document.getElementById("thinking");

    function addMsg(rol, texto) {
      const div = document.createElement("div");
      div.className = "msg " + rol;
      div.textContent = texto;
      messagesEl.appendChild(div);
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    async function enviar() {
      const texto = inputEl.value.trim();
      if (!texto) return;
      inputEl.value = "";
      addMsg("user", texto);
      thinking.classList.add("show");
      btn.disabled = true;

      try {
        const res = await fetch(ALEX_API + "/api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ mensaje: texto }),
        });
        const data = await res.json();
        addMsg("alex", data.respuesta || "(sin respuesta)");
      } catch (e) {
        addMsg("alex", "No pude conectar con Alex. ¿Está despierto el servidor en Render?");
      } finally {
        thinking.classList.remove("show");
        btn.disabled = false;
        inputEl.focus();
      }
    }

    btn.addEventListener("click", enviar);
    inputEl.addEventListener("keydown", (e) => {
      if (e.key === "Enter") enviar();
    });

    addMsg("alex", "¡Hola! Soy Alex. ¿En qué puedo ayudarte?");
  </script>
</body>
</html>
